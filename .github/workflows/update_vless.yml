name: Update VLESS Keys

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-vless:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Collect and deduplicate VLESS keys
        run: |
          python3 - <<'EOF'
          import requests
          import re
          import checker

          SOURCES = checker.VLESS_SOURCES

          unique_vless = set()
          stats = {}
          answered = 0

          for url in SOURCES:
              source_name = url.split("/")[-1]
              try:
                  resp = requests.get(url, timeout=15)
                  resp.raise_for_status()
                  text = resp.text
                  found = 0
                  for line in text.splitlines():
                      line = line.strip()
                      if line.startswith("vless://"):
                          unique_vless.add(line)
                          found += 1
                  stats[source_name] = found
                  answered += 1
                  print(f"\u2705 {source_name}: found {found} vless keys")
              except Exception as e:
                  print(f"\u274c {source_name}: {e}")
                  stats[source_name] = 0

          total = len(unique_vless)
          print(f"\nTotal unique VLESS keys: {total}")

          import os
          if total == 0:
              # Все источники недоступны: не затираем рабочий файл пустым.
              print("Ни одного ключа не получено, vless.txt не изменён.")
              raise SystemExit(0)
          previous = set()
          if os.path.exists("vless.txt"):
              with open("vless.txt", encoding="utf-8") as f:
                  previous = {line.strip() for line in f if line.strip().startswith("vless://")}
          # Частичный сбой источников не должен заменить список урезанным.
          if answered < len(SOURCES) // 2:
              print(f"Ответили только {answered} из {len(SOURCES)} источников, vless.txt не изменён.")
              raise SystemExit(0)
          if previous and total < len(previous) * 0.5:
              print(f"Ключей стало {total} вместо {len(previous)}, vless.txt не изменён.")
              raise SystemExit(0)
          if previous == unique_vless:
              # Заголовок с временем меняется при каждой записи, поэтому сравниваем только ключи.
              print("Набор ключей не изменился, vless.txt не перезаписан.")
              raise SystemExit(0)

          from datetime import datetime, timezone
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          header = f"""#profile-title: VLESS Keys Aggregator
          #profile-update-interval: 1
          #last-updated: {now}
          #total-keys: {total}
          """
          header = "\n".join(line.strip() for line in header.strip().splitlines())

          with open("vless.txt", "w", encoding="utf-8") as f:
              f.write(header + "\n\n")
              for key in sorted(unique_vless):
                  f.write(key + "\n")

          print(f"vless.txt written with {total} unique keys.")
          EOF

      - name: Check for changes
        id: check_changes
        run: |
          git add vless.txt
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to vless.txt, skipping commit and upload."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push vless.txt
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update vless.txt [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          # filter-vless.yml пушит в main параллельно, поэтому push может быть отклонён.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main
          done
          git push

      - name: Upload vless.txt to Yandex Disk
        if: steps.check_changes.outputs.changed == 'true'
        env:
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
        run: |
          DISK_PATH="VLESS Keys/vless.txt"

          # Создаём папку в корне Диска (игнорируем если уже есть)
          curl -s -X PUT \
            "https://cloud-api.yandex.net/v1/disk/resources?path=$(python3 -c "import urllib.parse; print(urllib.parse.quote('VLESS Keys'))")" \
            -H "Authorization: OAuth ${YANDEX_DISK_TOKEN}" > /dev/null 2>&1 || true

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
            "https://cloud-api.yandex.net/v1/disk/resources/upload?path=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$DISK_PATH'))")&overwrite=true" \
            -H "Authorization: OAuth ${YANDEX_DISK_TOKEN}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Yandex Disk API response (HTTP $HTTP_CODE): $BODY"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Failed to get upload URL (HTTP $HTTP_CODE)"
            exit 1
          fi

          UPLOAD_URL=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['href'])")

          # Загружаем файл
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: OAuth ${YANDEX_DISK_TOKEN}" \
            --data-binary "@vless.txt" \
            "$UPLOAD_URL")

          if [ "$HTTP_CODE" -eq 201 ] || [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ vless.txt uploaded to Yandex Disk"
          else
            echo "❌ Failed to upload file (HTTP $HTTP_CODE)"
            exit 1
          fi
