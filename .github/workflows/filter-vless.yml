name: Filter VLESS (TCP → TLS → Xray)

on:
  schedule:
    # Каждый час (UTC). GitHub может задержать запуск при высокой нагрузке.
    - cron: "0 * * * *"
  workflow_dispatch: {}        # ручной запуск из вкладки Actions

# Чтобы workflow мог делать commit/push в репозиторий
permissions:
  contents: write

# Не запускать несколько прогонов одновременно
concurrency:
  group: filter-vless
  cancel-in-progress: false

jobs:
  filter:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install "requests[socks]"

      - name: Install Xray-core
        run: |
          set -e
          mkdir -p "$HOME/xraybin"
          cd "$HOME/xraybin"
          curl -fsSL -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip
          chmod +x xray
          echo "$HOME/xraybin" >> "$GITHUB_PATH"

      - name: Run cascade filter
        run: |
          python filter_vless.py \
            --input vless.txt \
            --output vless_filtered.txt \
            --count 100

      - name: Deduplicate and validate like the app
        run: |
          python - <<'EOF'
          import checker
          infos = checker.parse_text(open("vless_filtered.txt", encoding="utf-8").read())
          seen = {}
          for info in infos:
              if checker.is_private_host(info["host"]):
                  continue
              seen.setdefault(checker.key_identity(info), info)
          with open("vless_filtered.txt", "w", encoding="utf-8") as fh:
              for info in seen.values():
                  fh.write(info["raw"] + "\n")
          print("after app rules: %d" % len(seen))
          EOF

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vless_filtered.txt
          if git diff --staged --quiet; then
            echo "Изменений нет — коммит не нужен"
          else
            git commit -m "chore: обновление vless_filtered.txt [skip ci]"
            # update_vless.yml пушит в main каждые 15 минут, поэтому push может быть отклонён.
            for attempt in 1 2 3; do
              git push && exit 0
              git pull --rebase -X theirs origin main
            done
            git push
          fi
